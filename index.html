<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EIPICO Dashboard</title>
<style>
body {font-family: Arial; background:#f4f6fb; text-align:center; padding:40px;}
.card {background:#fff; padding:20px; border-radius:12px; width:300px; margin:auto; box-shadow:0 10px 30px rgba(0,0,0,.1);}
input {width:100%; padding:10px; margin:8px 0;}
button {padding:10px; width:100%; background:#1a56db; color:#fff; border:none; border-radius:8px; cursor:pointer;}
.admin {margin-top:40px;}
.user {background:#eee; margin:5px; padding:10px;}
.logo {font-size:20px; font-weight:bold; margin-bottom:10px;}
</style>
</head>

<body>

<div class="card">
  <div class="logo">EIPICO Logo</div>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<div id="adminPanel" class="admin" style="display:none;">
  <h3>Pending Requests</h3>
  <div id="pending"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, setDoc, doc, getDocs, collection, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

const ADMIN_EMAIL = "YOUR_EMAIL";

// 🔐 Register
window.register = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const userCredential = await createUserWithEmailAndPassword(auth, email, password);
  const user = userCredential.user;

  await setDoc(doc(db, "users", user.uid), {
    email: email,
    approved: false
  });

  alert("Request sent for approval");
};

// 🔓 Login
window.login = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const userCredential = await signInWithEmailAndPassword(auth, email, password);
  const user = userCredential.user;

  if (email === ADMIN_EMAIL) {
    loadPending();
    document.getElementById("adminPanel").style.display = "block";
    alert("Welcome Admin");
  } else {
    const docSnap = await getDocs(collection(db, "users"));
    let approved = false;

    docSnap.forEach(d => {
      if (d.id === user.uid && d.data().approved) {
        approved = true;
      }
    });

    if (approved) {
      alert("Welcome to dashboard");
    } else {
      alert("Waiting for approval");
    }
  }
};

// 👑 Admin Load Pending
async function loadPending() {
  const snapshot = await getDocs(collection(db, "users"));
  const container = document.getElementById("pending");
  container.innerHTML = "";

  snapshot.forEach(d => {
    const data = d.data();

    if (!data.approved) {
      const div = document.createElement("div");
      div.className = "user";
      div.innerHTML = `
        ${data.email}
        <button onclick="approve('${d.id}')">Approve</button>
      `;
      container.appendChild(div);
    }
  });
}

// ✅ Approve
window.approve = async function(id) {
  await updateDoc(doc(db, "users", id), {
    approved: true
  });
  alert("Approved");
  loadPending();
};
</script>

</body>
</html>
