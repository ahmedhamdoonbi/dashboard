<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-market Dashboard — EIPICO</title>
    <style>
        :root {
            --blue: #1a56db;
            --blue-dark: #1240a8;
            --blue-light: #60a5fa; /* Added light blue for the center gradient */
            --accent: #f59e0b;
            --text: #1f2937;
            --border: #e5e7eb;
            --bg: #f9fafb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            /* Replaced linear gradient with a centered light blue radiating to dark blue */
            background: radial-gradient(circle at center, var(--blue-light) 0%, var(--blue-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app { 
            width: 100%;
            height: 100vh;
        }

        .auth-container {
            /* Applied frosted glass effect */
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 500px;
            margin: 0 auto;
            margin-top: 10vh; /* Centering adjustment */
        }

        .auth-header {
            background: transparent; /* Let the glass effect show through slightly */
            color: var(--text);
            padding: 40px 30px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .logo-img {
            width: 140px;
            height: auto;
            margin: 0 auto 20px;
            display: block;
            object-fit: contain;
        }

        .auth-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: 14px;
            color: #6b7280;
        }

        .auth-body {
            padding: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .tab.active {
            color: var(--blue);
            border-bottom-color: var(--blue);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        button.btn-primary:hover {
            background: var(--blue-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(26, 86, 219, 0.2);
        }

        /* Dashboard Layout - Maximized content area */
        .dashboard {
            display: none;
            width: 100%;
            height: 100%;
        }

        .dashboard.active {
            display: flex;
            flex-direction: column;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .dashboard-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .sign-out {
            background: var(--accent);
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s;
        }

        .sign-out:hover {
            opacity: 0.9;
        }

        .dashboard-main {
            flex: 1;
            padding: 20px;
            display: flex;
            /* Ensures the iframe container takes maximum available space */
            width: 100%; 
        }

        .iframe-container {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Authentication Screen -->
        <div id="authScreen" class="auth-container">
            <div class="auth-header">
                <!-- Replace src with actual EIPICO logo path or base64 -->
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="EIPICO Logo" class="logo-img">
                <h1>To-market Dashboard</h1>
                <p>Sign in to access your reports</p>
            </div>

            <div class="auth-body">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('login')">Login</div>
                    <div class="tab" onclick="switchTab('register')">Request Access</div>
                </div>

                <div id="login" class="tab-content active">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="name@eipico.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="••••••••">
                    </div>
                    <button class="btn-primary" onclick="simulateLogin()">Sign In</button>
                </div>

                <div id="register" class="tab-content">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" placeholder="e.g. Business Excellence">
                    </div>
                    <button class="btn-primary">Submit Request</button>
                </div>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboardScreen" class="dashboard">
            <div class="dashboard-header">
                <div class="dashboard-title">To-market Performance Dashboard</div>
                <button class="sign-out" onclick="signOut()">Sign Out</button>
            </div>
            <div class="dashboard-main">
                <div class="iframe-container">
                    <div class="loading-spinner" id="spinner"></div>
                    <!-- Your iframe will go here -->
                    <iframe id="reportFrame" src="" style="width: 100%; height: 100%; border: none; display: none;" onload="hideSpinner()"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Handle Tab Switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Simulate Login Transition
        function simulateLogin() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('dashboardScreen').classList.add('active');
            
            // Simulate iframe loading delay
            setTimeout(() => {
                const iframe = document.getElementById('reportFrame');
                // Replace with your actual embed URL
                // iframe.src = "YOUR_REPORT_URL_HERE"; 
                iframe.style.display = 'block';
                document.getElementById('spinner').style.display = 'none';
            }, 1500);
        }

        // Handle Sign Out
        function signOut() {
            document.getElementById('dashboardScreen').classList.remove('active');
            document.getElementById('authScreen').style.display = 'block';
            document.getElementById('reportFrame').style.display = 'none';
            document.getElementById('spinner').style.display = 'block';
        }

        function hideSpinner() {
            document.getElementById('spinner').style.display = 'none';
        }
    </script>
</body>
</html>
