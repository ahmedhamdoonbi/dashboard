<!-- Firebase SDK Modules -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  // 1. Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyB-uY3a89crvxT7vTtU_le3vHsNp6d5KvY",
    authDomain: "to-market-dashboard.firebaseapp.com",
    projectId: "to-market-dashboard"
  };

  // 2. Initialize
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ADMIN_EMAIL = "ahmd.hamdoon@gmail.com";
  const messageEl = document.getElementById('message');
  const adminPanel = document.getElementById('adminPanel');
  const pendingDiv = document.getElementById('pending');

  // --- UI Logic ---
  window.showTab = (tab) => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
    
    if(tab === 'login') {
      document.getElementById('login').classList.add('active');
      document.querySelectorAll('.tab')[0].classList.add('active');
    } else {
      document.getElementById('register').classList.add('active');
      document.querySelectorAll('.tab')[1].classList.add('active');
    }
  };

  // --- Auth Logic ---

  // Register Function
  window.register = async () => {
    const email = document.getElementById('regEmail').value;
    const pass = document.getElementById('regPass').value;
    
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, "users", userCredential.user.uid), {
        email: email,
        approved: false,
        role: "user"
      });
      messageEl.innerText = "⏳ Request sent. Waiting for admin approval.";
    } catch (e) {
      messageEl.innerText = "❌ Error: " + e.message;
    }
  };

  // Login Function
  window.login = async () => {
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPass').value;

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, pass);
      const user = userCredential.user;

      if (email === ADMIN_EMAIL) {
        messageEl.innerText = "👑 Admin Access Granted";
        adminPanel.style.display = "block";
        loadPending();
      } else {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        
        if (!userDoc.exists()) {
          // Auto-create record if missing
          await setDoc(doc(db, "users", user.uid), { email: email, approved: false });
          messageEl.innerText = "⏳ Status: Pending Approval";
        } else if (userDoc.data().approved) {
          messageEl.innerText = "✅ Access Granted! Redirecting...";
          // OPTIONAL: window.location.href = "dashboard.html"; 
        } else {
          messageEl.innerText = "❌ Your account is still pending approval.";
        }
      }
    } catch (e) {
      messageEl.innerText = "❌ Login Failed: " + e.message;
    }
  };

  // --- Admin Logic ---

  window.loadPending = async () => {
    pendingDiv.innerHTML = "Loading...";
    try {
      const q = query(collection(db, "users"), where("approved", "==", false));
      const querySnapshot = await getDocs(q);
      pendingDiv.innerHTML = "";
      
      querySnapshot.forEach((userDoc) => {
        const data = userDoc.data();
        const div = document.createElement("div");
        div.className = "user";
        div.innerHTML = `
          <span>${data.email}</span>
          <button onclick="approveUser('${userDoc.id}')">✔</button>
        `;
        pendingDiv.appendChild(div);
      });
    } catch (e) {
      console.error(e);
    }
  };

  window.approveUser = async (id) => {
    try {
      await updateDoc(doc(db, "users", id), { approved: true });
      loadPending();
    } catch (e) {
      alert("Error approving user");
    }
  };
</script>
