<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EIPICO Dashboard</title>

<style>
body{
  font-family:Arial;
  background:#f0f4fc;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  width:320px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

input{
  width:100%;
  padding:8px;
  margin:5px 0;
}

button{
  width:100%;
  padding:8px;
  margin-top:5px;
  background:#1a56db;
  color:white;
  border:none;
  cursor:pointer;
}

.hidden{display:none;}
</style>
</head>

<body>

<h2>🌍 Dashboard Login</h2>

<div class="card">

  <button onclick="showLogin()">Login</button>
  <button onclick="showRegister()">Register</button>

  <!-- LOGIN -->
  <div id="loginForm">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <!-- REGISTER -->
  <div id="registerForm" class="hidden">
    <input id="regName" placeholder="Name">
    <input id="regEmail" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">
    <button onclick="register()">Register</button>
  </div>

</div>

<div id="dashboard" class="hidden">
  <h3>Welcome 🎉</h3>
  <iframe src="https://app.powerbi.com/view?r=eyJrIjoiZTM2YjYxNzctZWQyMS00NGI0LTk4OGUtZDBiYWRmMGM4MDc2IiwidCI6IjZkYzNiZmNjLWI3ODYtNDYzYy05MDhmLWM1Y2U5YzhmNzA2YSJ9"></iframe>
</div>

<script>

// admin (غيره براحتك)
const ADMIN_EMAIL = "admin@eipico.net";

// toggle
function showLogin(){
  loginForm.classList.remove("hidden");
  registerForm.classList.add("hidden");
}

function showRegister(){
  loginForm.classList.add("hidden");
  registerForm.classList.remove("hidden");
}

// register
function register(){
  let users = JSON.parse(localStorage.getItem("users")) || [];

  const user = {
    name: regName.value,
    email: regEmail.value,
    password: regPassword.value,
    approved: false
  };

  if(users.find(u => u.email === user.email)){
    alert("User exists");
    return;
  }

  users.push(user);
  localStorage.setItem("users", JSON.stringify(users));

  alert("Registered. Waiting for admin approval.");
}

// login
function login(){
  let users = JSON.parse(localStorage.getItem("users")) || [];

  const user = users.find(
    u => u.email === loginEmail.value && u.password === loginPassword.value
  );

  if(!user){
    alert("Wrong email/password");
    return;
  }

  if(!user.approved){
    alert("Pending admin approval");
    return;
  }

  dashboard.classList.remove("hidden");
  document.querySelector(".card").classList.add("hidden");
}

// 🔥 ADMIN PANEL (hidden)
if(localStorage.getItem("adminMode")){
  showAdminPanel();
}

function showAdminPanel(){
  let users = JSON.parse(localStorage.getItem("users")) || [];

  let html = "<h3>Admin Panel</h3>";

  users.forEach((u,i)=>{
    if(!u.approved){
      html += `
        <div>
          ${u.email}
          <button onclick="approve(${i})">Approve</button>
        </div>
      `;
    }
  });

  document.body.innerHTML = html;
}

function approve(index){
  let users = JSON.parse(localStorage.getItem("users")) || [];
  users[index].approved = true;
  localStorage.setItem("users", JSON.stringify(users));
  location.reload();
}

// secret admin access 😎
if(window.location.hash === "#admin"){
  localStorage.setItem("adminMode", true);
  showAdminPanel();
}

</script>

</body>
</html>
