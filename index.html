<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIPICO Dashboard</title>

<style>
body {
  font-family: Arial;
  background:#f0f4fc;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

/* AUTH CARD */
.auth-card {
  background:white;
  padding:20px;
  border-radius:12px;
  width:320px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
  margin-bottom:20px;
}

input {
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  border:1px solid #ddd;
}

button {
  width:100%;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#1a56db;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.toggle {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.toggle button {
  background:#ddd;
  color:black;
}

/* DASHBOARD */
#dashboard {
  display:none;
  width:80%;
  max-width:900px;
}

iframe {
  width:100%;
  height:500px;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>🌍 To-Market 2026</h2>

<!-- AUTH -->
<div class="auth-card">

  <div class="toggle">
    <button onclick="showLogin()">Login</button>
    <button onclick="showRegister()">Register</button>
  </div>

  <!-- LOGIN -->
  <div id="loginForm">
    <input id="loginEmail" type="email" placeholder="Company Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <!-- REGISTER -->
  <div id="registerForm" style="display:none;">
    <input id="regName" type="text" placeholder="User Name">
    <input id="regEmail" type="email" placeholder="Company Email">
    <input id="regPassword" type="password" placeholder="Create Password">
    <button onclick="register()">Create Account</button>
  </div>

</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <iframe src="https://app.powerbi.com/view?r=eyJrIjoiZTM2YjYxNzctZWQyMS00NGI0LTk4OGUtZDBiYWRmMGM4MDc2IiwidCI6IjZkYzNiZmNjLWI3ODYtNDYzYy05MDhmLWM1Y2U5YzhmNzA2YSJ9"></iframe>
  <br><br>
  <button onclick="logout()">Logout</button>
</div>

<script>

// 🔁 toggle forms
function showLogin(){
  loginForm.style.display="block";
  registerForm.style.display="none";
}

function showRegister(){
  loginForm.style.display="none";
  registerForm.style.display="block";
}

// 🆕 REGISTER
function register(){
  const name = regName.value.trim();
  const email = regEmail.value.trim();
  const password = regPassword.value.trim();

  if(!name || !email || !password){
    alert("Please fill all fields");
    return;
  }

  if(!email.endsWith("@eipico.net")){
    alert("Use company email only");
    return;
  }

  let users = JSON.parse(localStorage.getItem("users")) || [];

  if(users.find(u => u.email === email)){
    alert("User already exists");
    return;
  }

  users.push({name,email,password});
  localStorage.setItem("users", JSON.stringify(users));

  alert("Account created 🎉");

  // autofill login
  loginEmail.value = email;
  loginPassword.value = password;

  showLogin();
}

// 🔐 LOGIN
function login(){
  let users = JSON.parse(localStorage.getItem("users")) || [];

  const user = users.find(
    u => u.email === loginEmail.value && u.password === loginPassword.value
  );

  if(user){
    localStorage.setItem("loggedUser", JSON.stringify(user));

    document.querySelector(".auth-card").style.display="none";
    dashboard.style.display="block";

  }else{
    alert("Invalid credentials");
  }
}

// 🚪 LOGOUT
function logout(){
  localStorage.removeItem("loggedUser");
  location.reload();
}

// 🔄 auto login if already logged
window.onload = function(){
  const user = JSON.parse(localStorage.getItem("loggedUser"));

  if(user){
    document.querySelector(".auth-card").style.display="none";
    dashboard.style.display="block";
  }
}

</script>

</body>
</html>
